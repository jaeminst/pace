version: "2"

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - revive
    - gosec
    - misspell
    - gocritic
    - gocyclo
    - unused
    # Correctness
    - errorlint # err == sentinel instead of errors.Is/As
    - nilerr # returning nil after a non-nil error check
    - bodyclose # unclosed http.Response.Body
    - contextcheck # context.Background() where a ctx is in scope
    - copyloopvar # loop-variable copies made redundant by Go 1.22 semantics
    - makezero # append to a slice created with a non-zero length
    - wastedassign
    - predeclared # shadowing len, cap, new, …
    - sqlclosecheck # internal/store drives database/sql directly
    - noctx # HTTP requests and SQL calls made without a context
    - exhaustive # a switch over an enum that misses a case
    # Style / hygiene
    - nolintlint # every //nolint must carry an explanation
    - perfsprint # fmt.Sprintf where a cheaper conversion exists
    - godot # comments end in a period
    - thelper # test helpers must call t.Helper()
    - tparallel # t.Parallel misuse
    - usetesting # os.Setenv/MkdirTemp in tests where t.* exists
    - depguard # keep the root module's dependency surface deliberate

  settings:
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G304 # file path from variable — callers are responsible for sanitising DBPath
    nolintlint:
      require-explanation: true
      require-specific: true
    exhaustive:
      # A default arm that names the case it is handling is exhaustive; the
      # codebase uses that shape deliberately, so that adding an enum value
      # cannot silently produce a compile error in unrelated code.
      default-signifies-exhaustive: true
    depguard:
      rules:
        root:
          files:
            - "!**/*_test.go"
          allow:
            - $gostd
            - golang.org/x/time/rate
            - modernc.org/sqlite
            - github.com/jaeminst/pace
          deny:
            - pkg: github.com/pkg/errors
              desc: use the standard library's errors package and %w wrapping

  # v2 moved exclusions under `linters`. The previous top-level
  # `issues.exclude-rules` block parsed without complaint but never applied.
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          # Tests drive SQLite directly to plant and inspect rows. There is no
          # deadline worth honouring on a t.TempDir database, and threading one
          # through would be noise.
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jaeminst/pace
