name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is kept in the matrix for its clock: time.Now has a coarser
        # resolution there, and several tests reason about token refill across
        # short intervals. Bugs that Linux's nanosecond clock hides show up
        # here as flakes.
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.6", "stable"]
    # GOTOOLCHAIN=local is what makes the floor leg mean anything. Without it
    # the go command silently downloads whatever go.mod's `go` line asks for,
    # so setup-go installing the floor version proves nothing about whether the
    # package still builds there — which is exactly the claim README makes.
    #
    # It also means this matrix entry must track go.mod's `go` line exactly: a
    # lower one cannot build the module at all, and would fail as a toolchain
    # error rather than as anything about the code.
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - run: go mod download

      - run: go vet ./...

      # -shuffle=on randomises test order, catching the inter-test dependencies
      # that a single large test file tends to accumulate.
      - run: go test -race -shuffle=on -count=1 -timeout=300s ./...

      # Keep benchmarks compiling and running; one iteration is enough to catch
      # rot without spending CI time on measurement.
      - run: go test -run=NONE -bench=. -benchtime=1x -timeout=300s ./...

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The seed corpus already runs as part of `go test`, so this job is about
      # finding inputs nobody thought of. Each target gets a short budget: long
      # enough to be worth running on every push, short enough that a green
      # build is not held up by it.
      #
      # Every fix in the v0.3.0 release notes attributed to fuzzing came out of
      # under a minute of this — including a path that could retarget a request
      # at another host.
      - name: Fuzz
        run: |
          set -euo pipefail
          # Derived, not hardcoded. A stale path used to be caught by
          # "[setup failed]" when the package was deleted outright, but a target
          # that merely MOVED is not: `go test ./pkg/ -fuzz='^Gone$'` prints
          # "no fuzz tests to fuzz" and exits 0, so the job goes green having
          # fuzzed nothing. Three restructures in three releases moved a target;
          # asking the toolchain where they are removes the class of bug.
          found=0
          for pkg in $(go list ./... | grep -v /examples); do
            for t in $(go test "$pkg" -list='^Fuzz' | grep '^Fuzz' || true); do
              echo "--- $pkg $t"
              go test "$pkg" -run=NONE -fuzz="^${t}$" -fuzztime=30s
              found=$((found + 1))
            done
          done
          test "$found" -gt 0 || { echo "no fuzz targets found at all"; exit 1; }
          echo "fuzzed $found targets"

      # A crash is worth more than the build minute it costs, so keep it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-corpus
          # Any package may grow a corpus; naming them individually is how the
          # list came to include a directory that no longer existed.
          path: '**/testdata/fuzz'
          if-no-files-found: ignore

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The conformance suites — shared/quotatest, store/storetest — are excluded
      # from the measurement, not from the test run. Most of their bodies are
      # failure arms that only execute against a broken backend, and the tests
      # that exercise those run each break in a *re-executed child process* (a
      # failing sub-test fails its parent, so asserting that a check fails needs
      # a separate process) whose coverage never reaches this profile. Counting
      # them measures the subprocess boundary rather than the library. They are
      # covered by something stronger instead: one test per break, asserting the
      # suite rejects it.
      - name: Test with coverage
        run: |
          go test -race -covermode=atomic \
            -coverpkg="$(go list ./... | grep -v /examples | grep -v test$ | paste -sd,)" \
            -coverprofile=coverage.out -timeout=300s ./...

      # The gate catches regressions; it is not a target. Actual coverage is
      # ~97%, up from ~93.5% at v0.7.0: removing the SQLite backend took its
      # unreachable SQL error branches with it. Raise this only when real
      # coverage rises.
      #
      # pipefail matters here: the step's exit status is awk's, and without it a
      # `go tool cover` that fails — or a coverage.out that was never written —
      # produces no `total:` line, awk matches nothing, and the gate passes.
      # The explicit "did we see a total at all" check covers the case where
      # cover succeeds but emits nothing useful.
      - name: Enforce coverage threshold
        run: |
          set -o pipefail
          go tool cover -func=coverage.out | awk '
            /^total:/ { seen = 1
                        if ($3 + 0 < 95) { print "Coverage " $3 " < 95%"; exit 1 }
                        print "Coverage " $3 }
            END       { if (!seen) { print "no total: line in coverage output"; exit 1 } }'

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
        env:
          GOTOOLCHAIN: local

      - run: golangci-lint run ./...

      # go vet does not check formatting; this is what actually enforces it.
      - run: golangci-lint fmt --diff
