name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows matters here: pace writes SQLite files, and Windows refuses to
        # delete files with open handles, so t.TempDir() cleanup surfaces leaked
        # database handles that Linux silently tolerates.
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26.6", "stable"]
    # GOTOOLCHAIN=local is what makes the floor leg mean anything. Without it
    # the go command silently downloads whatever go.mod's `go` line asks for,
    # so setup-go installing the floor version proves nothing about whether the
    # package still builds there — which is exactly the claim README makes.
    #
    # It also means this matrix entry must track go.mod's `go` line exactly: a
    # lower one cannot build the module at all, and would fail as a toolchain
    # error rather than as anything about the code.
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - run: go mod download

      - run: go vet ./...

      # -shuffle=on randomises test order, catching the inter-test dependencies
      # that a single large test file tends to accumulate.
      - run: go test -race -shuffle=on -count=1 -timeout=300s ./...

      # Keep benchmarks compiling and running; one iteration is enough to catch
      # rot without spending CI time on measurement.
      - run: go test -run=NONE -bench=. -benchtime=1x -timeout=300s ./...

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The seed corpus already runs as part of `go test`, so this job is about
      # finding inputs nobody thought of. Each target gets a short budget: long
      # enough to be worth running on every push, short enough that a green
      # build is not held up by it.
      #
      # Every fix in the v0.3.0 release notes attributed to fuzzing came out of
      # under a minute of this — including a path that could retarget a request
      # at another host.
      - name: Fuzz
        run: |
          set -euo pipefail
          for t in FuzzRestoreBucket FuzzDrainInstant; do
            go test ./bucket/        -run=NONE -fuzz="^${t}$" -fuzztime=30s
          done
          go test ./registry/      -run=NONE -fuzz='^FuzzShardIndex$' -fuzztime=30s
          go test ./urlx/             -run=NONE -fuzz='^FuzzBuild$'      -fuzztime=30s
          go test ./rate/            -run=NONE -fuzz='^FuzzLimitString$' -fuzztime=30s
          go test ./response/         -run=NONE -fuzz='^FuzzRetryAfter$'  -fuzztime=30s

      # A crash is worth more than the build minute it costs, so keep it.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: fuzz-corpus
          path: |
            bucket/testdata/fuzz
            registry/testdata/fuzz
            urlx/testdata/fuzz
            limit/testdata/fuzz
            response/testdata/fuzz
          if-no-files-found: ignore

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with coverage
        run: |
          go test -race -covermode=atomic \
            -coverpkg="$(go list ./... | grep -v /examples | paste -sd,)" \
            -coverprofile=coverage.out -timeout=300s ./...

      # The gate catches regressions; it is not a target. Actual coverage is
      # ~93.5%. What is left sits in two
      # places: SQL error branches in sqlite — a failure partway
      # through a migration, a crypto/rand that does not fail in practice —
      # reachable only with contrived injection that would add test machinery
      # without adding assurance; and the t.Skip arms in pacetest, which fire
      # only for backends with characteristics the in-repo one does not have.
      # Raise this only when real coverage rises.
      #
      # pipefail matters here: the step's exit status is awk's, and without it a
      # `go tool cover` that fails — or a coverage.out that was never written —
      # produces no `total:` line, awk matches nothing, and the gate passes.
      # The explicit "did we see a total at all" check covers the case where
      # cover succeeds but emits nothing useful.
      - name: Enforce coverage threshold
        run: |
          set -o pipefail
          go tool cover -func=coverage.out | awk '
            /^total:/ { seen = 1
                        if ($3 + 0 < 93) { print "Coverage " $3 " < 93%"; exit 1 }
                        print "Coverage " $3 }
            END       { if (!seen) { print "no total: line in coverage output"; exit 1 } }'

      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: coverage.out
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
        env:
          GOTOOLCHAIN: local

      - run: golangci-lint run ./...

      # go vet does not check formatting; this is what actually enforces it.
      - run: golangci-lint fmt --diff
