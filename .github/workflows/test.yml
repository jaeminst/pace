name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows matters here: pace writes SQLite files, and Windows refuses to
        # delete files with open handles, so t.TempDir() cleanup surfaces leaked
        # database handles that Linux silently tolerates.
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25.x", "stable"]
    # GOTOOLCHAIN=local is what makes the 1.25.x leg mean anything. Without it
    # the go command silently downloads whatever go.mod's `go` line asks for,
    # so setup-go installing 1.25 proves nothing about whether the package
    # still builds there — which is exactly the claim README makes.
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - run: go mod download

      - run: go vet ./...

      # -shuffle=on randomises test order, catching the inter-test dependencies
      # that a single large test file tends to accumulate.
      - run: go test -race -shuffle=on -count=1 -timeout=300s ./...

      # Keep benchmarks compiling and running; one iteration is enough to catch
      # rot without spending CI time on measurement.
      - run: go test -run=NONE -bench=. -benchtime=1x -timeout=300s ./...

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The seed corpus already runs as part of `go test`, so this job is about
      # finding inputs nobody thought of. Each target gets a short budget: long
      # enough to be worth running on every push, short enough that a green
      # build is not held up by it.
      #
      # Every fix in the v0.3.0 release notes attributed to fuzzing came out of
      # under a minute of this — including a path that could retarget a request
      # at another host.
      - name: Fuzz
        run: |
          set -euo pipefail
          for t in FuzzRestoreBucket FuzzDrainInstant; do
            go test ./internal/bucket/ -run=NONE -fuzz="^${t}$" -fuzztime=30s
          done
          for t in FuzzRetryAfter FuzzBuildURL FuzzShardIndex FuzzLimitString; do
            go test . -run=NONE -fuzz="^${t}$" -fuzztime=30s
          done

      # A crash is worth more than the build minute it costs, so keep it.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-corpus
          path: |
            testdata/fuzz
            internal/bucket/testdata/fuzz
          if-no-files-found: ignore

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with coverage
        run: |
          go test -race -covermode=atomic \
            -coverpkg="$(go list ./... | grep -v /examples | paste -sd,)" \
            -coverprofile=coverage.out -timeout=300s ./...

      # The gate catches regressions; it is not a target. Actual coverage is
      # ~94%, with the root package near 97%. The remainder is SQL error
      # branches in internal/store — a failure partway through a migration, a
      # crypto/rand that does not fail in practice — that are reachable only
      # with contrived injection, which would add test machinery without adding
      # assurance. Raise this only when real coverage rises.
      - name: Enforce coverage threshold
        run: |
          go tool cover -func=coverage.out |
            awk '/^total:/{if($3+0<93){print "Coverage "$3" < 93%"; exit 1}; print "Coverage "$3}'

      - uses: codecov/codecov-action@v4
        with:
          files: coverage.out
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
        env:
          GOTOOLCHAIN: local

      - run: golangci-lint run ./...

      # go vet does not check formatting; this is what actually enforces it.
      - run: golangci-lint fmt --diff
