name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go mod download

      - run: go vet ./...

      - run: go test -race -count=1 -timeout=120s -coverprofile=coverage.out ./...

      - uses: codecov/codecov-action@v4
        with:
          files: coverage.out
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # golangci-lint pre-built binaries are compiled with Go 1.25 and refuse to
      # run against Go 1.26 projects. Building from source with GOTOOLCHAIN=local
      # uses the Go version that setup-go installed (matching go.mod).
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
        env:
          GOTOOLCHAIN: local

      - run: golangci-lint run ./...
